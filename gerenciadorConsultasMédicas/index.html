<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de consultas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="header">
            <img id="logo-top" src="images/Logo.jpg" alt="Logo do consultório">
            <h1 id="header-top">
                Gerenciador de consultas médicas
            </h1>
            <nav>
                <ul id="menu-bar">
                    <li><a href="index.html">Home</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div id="main">
                <div id="formulario-main">
                    <form>
                        <input type="text" id="name" placeholder="Nome" required>
                        <input type="date" id="date" required>
                        <button type="submit" id="agendar">Agendar</button>
                    </form>
                    <div id="lista-main">
                        <h2 id="titulo-form">Consultas agendadas:</h2>
                    </div>
                </div>
        </div>
    </main>
    <footer>
        <div id="footer">
            <p id="text-footer">Criado por Anna Julia de Sousa Félix</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
